plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvzamani.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvzamani.app'
        minSdk 21
        targetSdk 34
        // GitHub her derlemede numarayı artırır; yeni sürüm eskisinin üstüne kurulur
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"

        // VLC'nin yerel kütüphaneleri: TV kutularının ve telefonların neredeyse tamamı ARM
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // İmza: AOSP test anahtarı (testkey). Hep aynı anahtar = yeni sürüm eskisinin üstüne kurulur, silmeye gerek yok.
    signingConfigs {
        release {
            storeFile file('testkey.p12')
            storeType 'pkcs12'
            storePassword 'tvzamani123'
            keyAlias 'tvzamani'
            keyPassword 'tvzamani123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    // ANA KAYNAK: ../web klasörü (index.html) olduğu gibi uygulamaya gömülür.
    sourceSets {
        main {
            assets.srcDirs = ['../web']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Yerel oynatıcı: Google ExoPlayer (Media3)
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"

    // Yerleşik VLC oynatıcı (libVLC)
    implementation 'org.videolan.android:libvlc-all:3.7.6'
}
