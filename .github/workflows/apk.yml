name: APK oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Oynatıcı kütüphanelerini uygulamaya göm
        run: |
          mkdir -p web/lib
          curl -fsSL -o web/lib/hls.min.js https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js
          curl -fsSL -o web/lib/mpegts.js https://cdn.jsdelivr.net/npm/mpegts.js@1/dist/mpegts.js
          curl -fsSL -o web/lib/qrcode.js https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js
          curl -fsSL -o web/lib/peerjs.min.js https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js
          ls -la web/lib

      - name: APK derle
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk TV-Zamani.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk TV-Zamani-32bit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Zamani-APK
          path: |
            TV-Zamani.apk
            TV-Zamani-32bit.apk

      - name: Releases'a yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" TV-Zamani.apk TV-Zamani-32bit.apk --title "TV Zamanı $TAG" --notes "Otomatik derleme. Telefon ve yeni TV için TV-Zamani.apk (64 bit). Eski 32 bit TV kutuları için TV-Zamani-32bit.apk." --latest
