name: APK oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: APK derle
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk TV-Zamani.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Zamani-APK
          path: TV-Zamani.apk

      - name: Releases'a yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" TV-Zamani.apk --title "TV Zamanı $TAG" --notes "Otomatik derleme. Kurmak için TV-Zamani.apk dosyasını indir." --latest
