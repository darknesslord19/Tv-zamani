<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<title>TV Zamanı</title>
<style>
:root{--bg:#0b0d12;--panel:#151821;--panel2:#1c202b;--line:#2a3040;--text:#e9ecf3;--muted:#8a93a6;--accent:#6c63ff;--accent2:#9fb8ff;--danger:#ff5d6c;--ok:#3ecf8e;--fs:clamp(13px,1.05vw,19px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:var(--fs)/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus{outline:none}
.muted{color:var(--muted)} .err:not(#player){color:var(--danger);min-height:1em}
.perr h2{color:#fff;margin:0} .small{font-size:.85em}
.btn{background:var(--panel2);border:2px solid transparent;padding:.6em 1.1em;border-radius:10px;font-weight:600}
.btn:focus,.btn:hover{border-color:#fff}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:#3a1820;color:#ffb3bb}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:.6em .8em;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
textarea{min-height:5em;resize:vertical;font-size:.8em;word-break:break-all}
.row{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.col{display:flex;flex-direction:column;gap:.5em}
.sp{flex:1}
.pill{background:var(--ok);color:#000;font-size:.7em;padding:.1em .5em;border-radius:6px;font-weight:800;vertical-align:middle}

/* ---------- Profiller ---------- */
#profiles{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8em;background:radial-gradient(circle at 50% 0,#1b1f30,var(--bg) 70%);z-index:40;padding:1em;overflow-y:auto}
#profiles .logo{font-size:1.4em;color:var(--muted)}
#profiles h1{font-size:2.2em;margin:0}
.plist{display:flex;gap:1.6em;flex-wrap:wrap;justify-content:center}
.pcard{display:flex;flex-direction:column;align-items:center;gap:.6em}
.pav{position:relative;width:clamp(90px,10vw,150px);aspect-ratio:1;border-radius:22%;display:flex;align-items:center;justify-content:center;font-size:2.6em;font-weight:800;color:#fff;border:4px solid transparent;transition:transform .15s}
.pav.add{background:var(--panel2);color:var(--muted)}
.pav em{position:absolute;right:.2em;bottom:.15em;font-size:.35em;font-style:normal}
.pcard:focus .pav,.pcard:hover .pav{border-color:#fff;transform:scale(1.07)}
.pcard span{color:var(--muted);font-weight:600}.pcard:focus span{color:#fff}
#profiles.manage .pav:not(.add)::after{content:"✎";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border-radius:18%;font-size:.7em}
.colors{display:flex;gap:.5em;flex-wrap:wrap}
.colors button{width:2.2em;height:2.2em;border-radius:50%;border:3px solid transparent}
.colors button.on,.colors button:focus{border-color:#fff}

/* ---------- Ana ekran ---------- */
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:1em;padding:1.1em 2.2em .8em}
.logo{font-weight:800;font-size:1.6em;letter-spacing:.3px}
.acct{display:flex;align-items:center;gap:.5em;background:var(--panel);border-radius:999px;padding:.4em 1em;border:2px solid transparent;max-width:40vw;white-space:nowrap;overflow:hidden}
.acct small{color:var(--muted)}
.dot{width:.7em;height:.7em;border-radius:50%;background:var(--accent);flex:none;display:inline-block}
.search{max-width:20em}
.hbtn{padding:.45em .9em;border-radius:10px;color:var(--accent2);font-weight:700;border:2px solid transparent;background:var(--panel)}
.clock{font-size:1.6em;font-weight:700;color:var(--accent2);font-variant-numeric:tabular-nums}
.acct:focus,.hbtn:focus,.acct:hover,.hbtn:hover{border-color:#fff}
.body{display:grid;grid-template-columns:clamp(220px,22vw,340px) 1fr;gap:1.2em;padding:0 2.2em 0;min-height:0}
aside{overflow-y:auto;min-height:0;padding:4px 4px 2em;scrollbar-width:none}
aside::-webkit-scrollbar{display:none}
.modes{display:flex;gap:.4em;margin-bottom:.5em}
.mode{flex:1;padding:.55em;border-radius:10px;background:var(--panel);font-weight:700;color:var(--muted);border:2px solid transparent}
.mode.on{background:var(--accent);color:#fff}
.cat{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:.75em 1em;margin:.35em 0;border-radius:12px;background:var(--panel);border:2px solid transparent;font-weight:600}
.cat span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:.6em}
.cat .n{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.cat.on{background:var(--panel2);color:var(--accent2)}
.cat:focus,.mode:focus,.cat:hover{border-color:#fff}
main{overflow-y:auto;min-height:0;padding:8px 10px 3em;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(120px,11vw,200px),1fr));gap:1.1em}
.grid.live{grid-template-columns:repeat(auto-fill,minmax(clamp(140px,13vw,240px),1fr))}
.grid.live.posters{grid-template-columns:repeat(auto-fill,minmax(clamp(120px,11vw,200px),1fr))}
.grid.posters .livec{aspect-ratio:2/3;background:var(--panel)}
.grid.posters .livec img,.livec.poster img{object-fit:cover;padding:0}
.grid.posters .livec:not(.poster) img{object-fit:contain;padding:18% 15% 35%}
.grid.posters .livec .num{display:none}
.grid.posters .livec.poster .cap{opacity:0;background:linear-gradient(transparent,rgba(0,0,0,.9));text-align:left}
.grid.posters .livec.poster:focus .cap,.grid.posters .livec.poster:hover .cap{opacity:1}
.card{position:relative;border-radius:10px;overflow:hidden;background:var(--panel);aspect-ratio:2/3;border:3px solid transparent;transition:transform .15s}
.card:focus,.card:hover{border-color:#fff;transform:scale(1.05);z-index:2}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:.6em;text-align:center;font-weight:700;color:var(--muted)}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:1.6em .6em .5em;background:linear-gradient(transparent,rgba(0,0,0,.9));font-size:.85em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;text-align:left}
.card:focus .cap,.card:hover .cap{opacity:1}
.card.livec{aspect-ratio:16/10;background:linear-gradient(160deg,#1d2230,#12151d)}
.livec img{object-fit:contain;padding:10% 20% 30%}
.livec .cap{opacity:1;background:none;text-align:center}
.livec .num{position:absolute;top:.4em;left:.55em;font-size:.75em;color:var(--muted)}
.fav-badge{position:absolute;top:.3em;right:.45em;color:#ffd166;text-shadow:0 1px 3px #000}
.cprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}
.cprog i{display:block;height:100%;background:var(--danger)}
.empty{grid-column:1/-1;color:var(--muted);padding:3em 1em;text-align:center}
.empty h2{color:var(--text)}
.loading{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:1em;padding:5em;color:var(--muted)}
.loading i{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}

/* ---------- Afiş hareketleri ---------- */
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
:is(.card:not(.livec),.grid.posters .livec,.livec.poster){animation:cardIn .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .15s}
:is(.card:not(.livec),.grid.posters .livec,.livec.poster)::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.24) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
:is(.card:not(.livec),.grid.posters .livec,.livec.poster):is(:focus,:hover)::after{transform:translateX(130%);transition:transform .75s ease}
:is(.card:not(.livec),.grid.posters .livec,.livec.poster) img{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
:is(.card:not(.livec),.grid.posters .livec,.livec.poster):is(:focus,:hover) img{transform:scale(1.09)}
:is(.card:not(.livec),.grid.posters .livec,.livec.poster):is(:focus,:hover){box-shadow:0 16px 36px rgba(0,0,0,.6),0 0 26px rgba(108,99,255,.5)}
:is(.card:not(.livec),.grid.posters .livec,.livec.poster):active{transform:scale(.97)}
.card .cap{transform:translateY(8px);transition:opacity .25s,transform .25s}
.card:is(:focus,:hover) .cap{transform:none}
@keyframes glow{0%,100%{box-shadow:0 16px 36px rgba(0,0,0,.6),0 0 18px rgba(108,99,255,.4)}50%{box-shadow:0 16px 36px rgba(0,0,0,.6),0 0 34px rgba(108,99,255,.75)}}
:is(.card:not(.livec),.grid.posters .livec,.livec.poster):focus{animation:glow 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){:is(.card,.livec){animation:none!important;transition:none!important}.card::after{display:none}}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:100;padding:1em}
#modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(720px,100%);max-height:94vh;overflow-y:auto;padding:1.6em}
.mbox.narrow{width:min(440px,100%)} .mbox.wide{width:min(940px,100%)}
.mbox h2{margin:0 0 .8em}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:1em;margin-bottom:.8em}
.mhead h2{margin:0}
.field{margin:.7em 0;flex:1;min-width:12em}
.field label{display:block;color:var(--muted);font-size:.85em;margin-bottom:.3em}
.tabs{display:flex;gap:.4em;flex-wrap:wrap;margin-bottom:1em}
.tab{padding:.5em 1em;border-radius:10px;background:var(--panel2);border:2px solid transparent;font-weight:700;color:var(--muted)}
.tab.on{color:#fff;background:var(--accent)}
.tab:focus,.tab:hover{border-color:#fff}
.li{display:flex;align-items:center;gap:.8em;padding:.8em 1em;border-radius:12px;background:var(--panel2);margin:.4em 0;border:2px solid transparent;width:100%;text-align:left;flex-wrap:wrap}
button.li:focus,button.li:hover{border-color:#fff}
.li .grow{flex:1;min-width:10em}
.li small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis}
.li b.v{color:var(--accent2)}
.li .eprog{flex-basis:100%;height:3px;background:var(--line);border-radius:2px}
.li .eprog i{display:block;height:100%;background:var(--danger)}
.keypad{display:grid;grid-template-columns:repeat(3,4.2em);gap:.6em;justify-content:center}
.keypad button{height:3.4em;border-radius:12px;background:var(--panel2);font-size:1.2em;font-weight:700;border:2px solid transparent}
.keypad button:focus,.keypad button:hover{border-color:#fff}
.pindots{display:flex;gap:.8em;justify-content:center;margin:1em 0 1.4em}
.pindots i{width:1em;height:1em;border-radius:50%;border:2px solid var(--muted)}
.pindots i.f{background:#fff;border-color:#fff}
.detail{display:flex;gap:1.4em}
.detail>img{width:min(210px,35%);border-radius:10px;align-self:flex-start;object-fit:cover}
.detail .info{flex:1;min-width:0}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:1em}
.tcard{background:var(--panel2);border-radius:14px;padding:1.1em}
.tcard h3{margin:.1em 0 .4em}
.bigcode{font-size:2.6em;font-weight:800;letter-spacing:.12em;text-align:center;margin:.3em 0;color:var(--accent2);font-variant-numeric:tabular-nums}
.qr{display:flex;justify-content:center}
.qr svg{background:#fff;border-radius:10px;width:190px;height:190px}

/* ---------- Oynatıcı ---------- */
#player{position:fixed;inset:0;background:#000;z-index:50;overflow:hidden}
#vid{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.pui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;opacity:0;transition:opacity .25s;pointer-events:none;background:linear-gradient(rgba(0,0,0,.75),transparent 22%,transparent 58%,rgba(0,0,0,.88))}
#player.ui .pui{opacity:1;pointer-events:auto}
#player.ui{cursor:default} #player:not(.ui){cursor:none}
.ptop{display:flex;align-items:center;gap:1em;padding:1.2em 2em}
.ptitle{min-width:0}
.ptitle b{font-size:1.4em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle span{color:#bbb}
.pclock{font-size:1.4em;font-weight:700;font-variant-numeric:tabular-nums}
.live-badge{background:#e53935;color:#fff;font-weight:800;padding:.15em .55em;border-radius:6px;font-size:.8em;display:none}
#player.islive .live-badge{display:inline-block}
#player.islive .vod{display:none!important}
.pbot{padding:1em 2em 1.6em}
.seek{position:relative;height:8px;background:rgba(255,255,255,.22);border-radius:6px;cursor:pointer;border:2px solid transparent;margin:.6em 0;touch-action:none}
.seek:focus{border-color:#fff;height:14px}
.seek .buf{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.35);border-radius:6px}
.seek .pr{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px}
.ptime{display:flex;justify-content:space-between;color:#ddd;font-variant-numeric:tabular-nums;font-size:.9em}
.pctrls{display:flex;align-items:center;gap:.5em;margin-top:.7em}
.pb{width:3em;height:3em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:2px solid transparent;background:rgba(255,255,255,.1);font-weight:800;font-size:1em;flex:none;color:#fff}
.pb svg{width:1.5em;height:1.5em;fill:currentColor}
.pb.big{width:3.9em;height:3.9em;background:#fff;color:#000}
.pb:focus,.pb:hover{border-color:#fff;background:rgba(255,255,255,.28)}
.pb.big:focus{box-shadow:0 0 0 4px var(--accent2);background:#fff}
.pb.on{color:#ffd166}
#pVol{width:7em;padding:0;border:0;background:none;accent-color:var(--accent)}
.spin{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border:5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite;display:none;pointer-events:none}
#player.loading .spin{display:block}
.pstat{position:absolute;left:0;right:0;top:calc(50% + 46px);text-align:center;color:#ccc;font-size:.9em;display:none;pointer-events:none;text-shadow:0 1px 4px #000;padding:0 1em}
#player.loading .pstat{display:block}
.osd-num{position:absolute;top:.6em;right:1em;font-size:3.5em;font-weight:800;text-shadow:0 2px 10px #000;display:none;font-variant-numeric:tabular-nums}
.perr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:.6em;background:rgba(0,0,0,.82);text-align:center;padding:2em;z-index:2}
.perr p{max-width:40em;color:#ccc}
#player.err .perr{display:flex}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(400px,92vw);background:rgba(16,18,26,.97);padding:1.3em;overflow-y:auto;display:none;z-index:3;border-left:1px solid var(--line)}
.sheet.left{left:0;right:auto;border-left:0;border-right:1px solid var(--line)}
.sheet.open{display:block}
.sheet h3{margin:.2em 0 .8em}
.opt{display:flex;justify-content:space-between;align-items:center;gap:.8em;width:100%;padding:.75em 1em;border-radius:10px;border:2px solid transparent;text-align:left;margin:.15em 0}
.opt.on{color:var(--accent2);background:rgba(108,99,255,.15)}
.opt:focus,.opt:hover{border-color:#fff}
.opt .v{color:var(--muted);text-align:right;overflow-wrap:anywhere;max-width:60%;font-size:.9em}
.chi{display:flex;align-items:center;gap:.7em;min-width:0}
.chi em{font-style:normal;color:var(--muted);width:2.6em;flex:none;font-variant-numeric:tabular-nums}
.chi img{width:2.6em;height:1.8em;object-fit:contain;flex:none}
.chi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);background:rgba(22,24,32,.96);padding:.7em 1.2em;border-radius:12px;z-index:200;display:none;align-items:center;gap:1em;border:1px solid var(--line);max-width:90vw}
.toast.show{display:flex}

/* ---------- Telefon ---------- */
@media (max-width:760px){
 header{flex-wrap:wrap;padding:.8em 1em .5em;gap:.5em}
 .logo{font-size:1.25em}
 .acct{max-width:55vw}
 .search{order:9;max-width:none;flex-basis:100%}
 .clock,.hide-m{display:none!important}
 .body{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:0 .8em;gap:.4em}
 aside{display:flex;overflow-x:auto;overflow-y:hidden;gap:.4em;padding:2px 2px .4em}
 .modes{margin:0;flex:none}
 .mode{flex:none;padding:.5em .9em}
 .cat{width:auto;flex:none;margin:0;padding:.5em .9em}
 .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:.6em}
 .grid.live{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
 .grid.live.posters{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
 .card:focus,.card:hover{transform:none}
 .card .cap{opacity:1}
 .tgrid{grid-template-columns:1fr}
 .detail{flex-direction:column}.detail>img{width:45%}
 .ptop{padding:.8em 1em}.pbot{padding:.6em 1em 1.2em}
 .pctrls{gap:.3em;flex-wrap:wrap;justify-content:center}
 .pb{width:2.6em;height:2.6em}.pb.big{width:3.3em;height:3.3em}
 .pctrls .sp{flex-basis:100%;height:0}
}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mpegts.js@1/dist/mpegts.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

<div id="profiles" hidden></div>

<div id="app" hidden>
 <header>
  <div class="logo">TV Zamanı</div>
  <button class="acct focusable" id="hdrAcct"></button>
  <div class="sp"></div>
  <input id="search" class="search" type="search" placeholder="🔍 Kanal, film, dizi ara…" autocomplete="off">
  <button class="hbtn focusable" id="btnRefresh">Yenile</button>
  <button class="hbtn focusable" id="btnSettings">Ayarlar</button>
  <div class="clock" id="clock">--:--</div>
 </header>
 <div class="body">
  <aside id="side"></aside>
  <main id="main"><div class="grid" id="grid"></div><div id="sentinel" style="height:1px"></div></main>
 </div>
</div>

<div id="player" hidden>
 <video id="vid" playsinline webkit-playsinline preload="auto"></video>
 <div class="spin"></div>
 <div class="pstat" id="pStat"></div>
 <div class="osd-num" id="osdNum"></div>
 <div class="pui" id="pui">
  <div class="ptop">
   <button class="pb focusable" id="pBack" aria-label="Geri"></button>
   <div class="ptitle"><b id="pTitle"></b><span id="pSub"></span></div>
   <span class="live-badge">CANLI</span>
   <div class="sp"></div>
   <div class="pclock" id="pClock"></div>
  </div>
  <div class="pbot">
   <div class="vod">
    <div class="seek focusable" id="pSeek" tabindex="0"><div class="buf" id="pBuf"></div><div class="pr" id="pPr"></div></div>
    <div class="ptime"><span id="tCur">0:00</span><span id="tDur"></span></div>
   </div>
   <div class="pctrls">
    <button class="pb focusable" id="pPrev" aria-label="Önceki"></button>
    <button class="pb focusable vod" id="pRw" aria-label="10 sn geri">−10</button>
    <button class="pb big focusable" id="pPlay" aria-label="Oynat/Duraklat"></button>
    <button class="pb focusable vod" id="pFf" aria-label="10 sn ileri">+10</button>
    <button class="pb focusable" id="pNext" aria-label="Sonraki"></button>
    <div class="sp"></div>
    <button class="pb focusable" id="pList" aria-label="Liste"></button>
    <button class="pb focusable" id="pFav" aria-label="Favori"></button>
    <button class="pb focusable" id="pMute" aria-label="Ses"></button>
    <input type="range" id="pVol" class="hide-m" min="0" max="1" step="0.05" value="1" aria-label="Ses seviyesi">
    <button class="pb focusable" id="pAspect" aria-label="Görüntü oranı"></button>
    <button class="pb focusable" id="pSet" aria-label="Ayarlar"></button>

function proxify(u){const p=(S().proxy||'').trim();if(!p)return u;return p.includes('{url}')?p.replace('{url}',encodeURIComponent(u)):p+u}
async function xfetch(url,json){
 const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),30000);
 try{
  const r=await fetch(proxify(url),{signal:ctl.signal});
  if(!r.ok)throw new Error('Sunucu hatası (HTTP '+r.status+')');
  const txt=await r.text();
  return json?JSON.parse(txt):txt;
 }finally{clearTimeout(t)}
}

/* ---------------- M3U ---------------- */
function hdrName(k){k=k.trim().toLowerCase();
 return /^(http-)?user-agent$/.test(k)?'User-Agent':/^(http-)?refer(r)?er$/.test(k)?'Referer':/^(http-)?origin$/.test(k)?'Origin':/^(http-)?cookie$/.test(k)?'Cookie':''}
/* "adres|User-Agent=x&Referer=y" (Kodi biçimi) → {url, h} */
function splitUrlHdr(line){
 const i=line.indexOf('|');if(i<0||!/=/.test(line.slice(i+1)))return{url:line,h:null};
 const h={};line.slice(i+1).split('&').forEach(p=>{const j=p.indexOf('=');if(j<1)return;const k=hdrName(p.slice(0,j));if(!k)return;let v=p.slice(j+1);try{v=decodeURIComponent(v)}catch(e){}h[k]=v});
 return{url:line.slice(0,i),h:Object.keys(h).length?h:null};
}
function applyUa(){try{if(IN_APP&&AndroidBridge.setUa)AndroidBridge.setUa(UAMAP[S().ua]||UAMAP.app)}catch(e){}}
function parseM3U(txt){
 const out=[];let cur=null,n=0,liveN=0,hd=null;
 for(let line of txt.split(/\r?\n/)){
  line=line.trim();if(!line)continue;
  if(/^#EXTVLCOPT:/i.test(line)){const s=line.slice(11),j=s.indexOf('=');if(j>0){const k=hdrName(s.slice(0,j));if(k)(hd=hd||{})[k]=s.slice(j+1).trim()}continue}
  if(/^#EXTHTTP:/i.test(line)){try{const o=JSON.parse(line.slice(9));for(const k in o){const nk=hdrName(k);if(nk)(hd=hd||{})[nk]=String(o[k])}}catch(e){}continue}
  if(/^#EXTINF/i.test(line)){
   const a=k=>{const m=line.match(new RegExp(k+'="([^"]*)"','i'));return m?m[1].trim():''};
   const stripped=line.replace(/[\w-]+="[^"]*"/g,'');const ci=stripped.indexOf(',');
   cur={logo:a('tvg-logo'),group:a('group-title')||'Diğer',num:+a('tvg-chno')||0,name:(ci>-1?stripped.slice(ci+1).trim():'')||a('tvg-name')||'Kanal'};
  }else if(/^#EXTGRP:/i.test(line)){if(cur)cur.group=line.slice(8).trim()||cur.group}
  else if(line[0]==='#')continue;
  else{
   const it=cur||{name:decodeURIComponent(line.split('/').pop()||'Kanal'),group:'Diğer',logo:'',num:0};
   const sp=splitUrlHdr(line);line=sp.url;
   if(sp.h||hd)it.h=Object.assign({},hd||{},sp.h||{});hd=null;
   it.url=line;it.id='m'+(++n);
   it.kind=(/\/(movie|series)\//i.test(line)||/\.(mp4|mkv|avi|mov|m4v|webm)(\?|$)/i.test(line)||/\((?:19|20)\d{2}\)/.test(it.name||''))?'movie':'live';
   if(it.kind==='live'){liveN++;if(!it.num)it.num=liveN}else delete it.num;
   out.push(it);cur=null;
  }
 }
 return out;
}

/* ---------------- Xtream Codes ---------------- */
function xt(src){const base=src.server.trim().replace(/\/+$/,'');return{base,api:`${base}/player_api.php?username=${encodeURIComponent(src.user)}&password=${encodeURIComponent(src.pass)}`,path:`${src.user}/${src.pass}`}}
async function loadXtream(src){
 const {base,api,path}=xt(src);
 const info=await xfetch(api,true);
 if(!info||!info.user_info||info.user_info.auth==0)throw new Error('Giriş başarısız: kullanıcı adı veya şifre hatalı.');
 const ui=info.user_info;
 const get=a=>xfetch(api+'&action='+a,true).then(r=>Array.isArray(r)?r:[]).catch(()=>[]);
 const [lc,ls,vc,vs,sc,ss]=await Promise.all(['get_live_categories','get_live_streams','get_vod_categories','get_vod_streams','get_series_categories','get_series'].map(get));
 const nm=a=>{const m={};a.forEach(c=>m[c.category_id]=c.category_name);return m};
 const ord=a=>{const m={};a.forEach((c,i)=>m[c.category_id]=i);return m};
 const srt=(arr,cats)=>{const o=ord(cats);return arr.sort((a,b)=>(o[a.category_id]??1e9)-(o[b.category_id]??1e9))};
 const L=nm(lc),V=nm(vc),SC=nm(sc),items=[];
 srt(ls,lc).forEach((s,i)=>items.push({id:'l'+s.stream_id,kind:'live',name:s.name||'Kanal',logo:s.stream_icon||'',group:L[s.category_id]||'Diğer',num:+s.num||i+1,url:`${base}/live/${path}/${s.stream_id}.m3u8`,xt:1}));
 srt(vs,vc).forEach(s=>items.push({id:'v'+s.stream_id,kind:'movie',name:s.name||'Film',logo:s.stream_icon||'',group:V[s.category_id]||'Diğer',rating:s.rating||'',ad:+s.added||0,sid:s.stream_id,url:`${base}/movie/${path}/${s.stream_id}.${s.container_extension||'mp4'}`,xt:1}));
 srt(ss,sc).forEach(s=>items.push({id:'s'+s.series_id,kind:'series',name:s.name||'Dizi',logo:s.cover||'',group:SC[s.category_id]||'Diğer',rating:s.rating||'',ad:+s.last_modified||0,seriesId:s.series_id,xt:1}));
 return{items,info:{status:ui.status,exp:+ui.exp_date||0,active:ui.active_cons,max:ui.max_connections}};
}
async function loadSeries(it){
 if(RT.seriesCache.has(it.id))return RT.seriesCache.get(it.id);
 const src=activeSrc();const {base,api,path}=xt(src);
 const d=await xfetch(api+'&action=get_series_info&series_id='+it.seriesId,true);
 const eps=(d&&d.episodes)||{};
 const seasons=Object.keys(eps).sort((a,b)=>a-b).map(sn=>({n:sn,eps:(eps[sn]||[]).map(e=>({
  id:'e'+e.id,kind:'episode',name:`S${pad(e.season||sn)}B${pad(e.episode_num)}${e.title?' · '+e.title:''}`,
  logo:(e.info&&e.info.movie_image)||it.logo,url:`${base}/series/${path}/${e.id}.${e.container_extension||'mp4'}`,group:it.name,parent:it.id,xt:1}))}));
 const r={seasons,plot:(d&&d.info&&d.info.plot)||'',genre:(d&&d.info&&d.info.genre)||''};
 RT.seriesCache.set(it.id,r);return r;
}

/* ---------------- TMDB (eksik afişler, özet, puan) ---------------- */
const TM={mem:{},pend:{},loaded:false,bad:false,n:0,w:[]};
const tmKey=()=>String(S().tmdbKey||'').trim();
async function tmLoad(){if(TM.loaded)return;TM.loaded=true;try{TM.mem=(await idb.get('tmdb_cache'))||{}}catch(e){}}
let tmSaveT;function tmSave(){clearTimeout(tmSaveT);tmSaveT=setTimeout(()=>{try{idb.set('tmdb_cache',TM.mem)}catch(e){}},2500)}
function cleanTitle(n){
 let s=String(n||'').trim(),y='';
 const m=s.match(/[(\[]((?:19|20)\d{2})[)\]]/)||s.match(/\s((?:19|20)\d{2})\s*$/);if(m)y=m[1];
 s=s.replace(/^\s*[\[|(]?\s*[A-ZÇĞİÖŞÜ]{2,3}\s*[\]|)]\s*[-:|]?\s*/,'').replace(/^\s*[A-Z]{2,3}\s*[:|-]\s+/,'');
 const cut=s.search(/[(\[]/);if(cut>2)s=s.slice(0,cut);
 s=s.replace(/\b(4K|UHD|FHD|HD|1080p|720p|2160p|HEVC|H\.?26[45]|x26[45]|DUAL|TR DUBLAJ|DUBLAJ|ALTYAZILI|MULTI)\b/gi,'').replace(/\s+((?:19|20)\d{2})\s*$/,'').replace(/[\s\-–|:._]+$/,'').replace(/\s{2,}/g,' ').trim();
 return{t:s||String(n||'').trim(),y};
}
async function tmGet(path,params){
 const key=tmKey(),bearer=/^eyJ/.test(key);
 const u=new URL('https://api.themoviedb.org/3/'+path);
 Object.entries(params||{}).forEach(([k,v])=>{if(v!=null&&v!=='')u.searchParams.set(k,v)});
 if(!bearer)u.searchParams.set('api_key',key);
 const r=await fetch(u.toString(),bearer?{headers:{Authorization:'Bearer '+key,accept:'application/json'}}:{});
 if(r.status===401||r.status===403){const e=new Error('auth');e.auth=true;throw e}
 if(!r.ok)return null;return r.json();
}
async function tmSlot(f){if(TM.n>=3)await new Promise(r=>TM.w.push(r));TM.n++;try{return await f()}finally{TM.n--;const r=TM.w.shift();r&&r()}}
async function tmFetch(kind,ct){
 const ep=kind==='series'?'search/tv':'search/movie',yp=kind==='series'?'first_air_date_year':'year';
 const base={query:ct.t,language:'tr-TR',include_adult:'false'};
 let d=await tmGet(ep,{...base,[yp]:ct.y}),res=(d&&d.results)||[];
 if(!res.length&&ct.y){d=await tmGet(ep,base);res=(d&&d.results)||[]}
 const m=res.find(x=>x.poster_path)||res[0];if(!m)return null;
 return{poster:m.poster_path?'https://image.tmdb.org/t/p/w342'+m.poster_path:'',backdrop:m.backdrop_path?'https://image.tmdb.org/t/p/w780'+m.backdrop_path:'',
  plot:m.overview||'',rating:m.vote_average?m.vote_average.toFixed(1):'',year:(m.release_date||m.first_air_date||'').slice(0,4)};
}
async function tmdbInfo(it){
 if(!tmKey()||TM.bad||!it||(it.kind!=='movie'&&it.kind!=='series'))return null;
 await tmLoad();
 const ct=cleanTitle(it.name),ck=(it.kind==='series'?'t:':'m:')+norm(ct.t)+'|'+ct.y;
 const c=TM.mem[ck];
 if(c)return c.miss?(Date.now()-c.t>3*864e5?null:null):c;
 if(TM.pend[ck])return TM.pend[ck];
 return TM.pend[ck]=tmSlot(()=>tmFetch(it.kind,ct)).then(r=>{TM.mem[ck]=r||{miss:1,t:Date.now()};tmSave();return r},e=>{if(e.auth&&!TM.bad){TM.bad=true;toast('TMDB anahtarı geçersiz — Ayarlar > Oynatıcı bölümünden kontrol et')}return null}).finally(()=>{delete TM.pend[ck]});
}
function itemOfEl(el){return el.dataset.i!=null?RT.list[+el.dataset.i]:null}
function tmdbScan(root){
 if(!tmKey()||TM.bad||!root)return;
 $$('.card:not(.livec):not([data-tm])',root).forEach(el=>{
  if($('img',el))return;const it=itemOfEl(el);if(!it||(it.kind!=='movie'&&it.kind!=='series'))return;
  el.dataset.tm=1;
  tmdbInfo(it).then(i=>{
   if(!i||!i.poster||!document.contains(el)||$('img',el))return;
   const im=document.createElement('img');im.alt='';im.loading='lazy';im.src=i.poster;im.onerror=()=>im.remove();
   const ph=$('.ph',el);ph?ph.after(im):el.prepend(im);
  }).catch(()=>{});
 });
}
function imgErr(img){
 const c=img.closest('.card');img.remove();
 if(c&&!c.classList.contains('livec')){delete c.dataset.tm;tmdbScan(c.parentNode)}
}

/* ---------------- Yedek / içe aktarma ---------------- */
async function buildPayload(scope,full){
 const list=scope==='all'?DB.profiles:[prof()];
 const profiles=JSON.parse(JSON.stringify(list)).map(p=>{if(!full)p.hist={};return p});
 const files={};
 if(full)for(const p of profiles)for(const s of p.sources)if(s.type==='file'){const c=await idb.get('file_'+s.id);if(c)files[s.id]=c}
 if(!full)profiles.forEach(p=>p.sources=p.sources.filter(s=>s.type!=='file'));
 return{app:'tvkutu',v:1,type:scope,t:Date.now(),profiles,files};
}
async function downloadBackup(){
 const pl=await buildPayload('all',true);
 const d0=new Date(),fname=`tvzamani-yedek-${d0.getFullYear()}${pad(d0.getMonth()+1)}${pad(d0.getDate())}.json`;
 if(IN_APP&&AndroidBridge.saveFile){const p=AndroidBridge.saveFile(fname,JSON.stringify(pl));toast(p?'Yedek kaydedildi: '+p:'Yedek kaydedilemedi');return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(pl)],{type:'application/json'}));
 const d=new Date();a.download=`tvkutu-yedek-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);
 toast('Yedek dosyası indirildi');
}
function importPayload(pl,mode){
 if(mode==='replace')DB.profiles=[];
 for(const sp of pl.profiles){
  const map={};
  const sources=(sp.sources||[]).map(s=>{const n={...s,id:uid()};map[s.id]=n.id;const c=pl.files&&pl.files[s.id];if(c)idb.set('file_'+n.id,c);return n});
  const rek=o=>Object.fromEntries(Object.entries(o||{}).map(([k,v])=>{const i=k.indexOf('|');return[(map[k.slice(0,i)]||k.slice(0,i))+k.slice(i),v]}));
  if(mode==='merge'&&prof()){
   const p=prof();p.sources.push(...sources);Object.assign(p.fav,rek(sp.fav));if(!p.active&&sources[0])p.active=sources[0].id;
  }else{
   const np=newProfile(sp.name||'Profil',sp.color||COLORS[0]);
   Object.assign(np,{pin:sp.pin||'',sources,active:map[sp.active]||(sources[0]?sources[0].id:null),fav:rek(sp.fav),hist:rek(sp.hist),settings:{...DEF,...(sp.settings||{})}});
   DB.profiles.push(np);
  }
 }
 if(mode==='replace')DB.current=null;
 save();
}

 <div class="col">${cur&&one&&!$('#app').hidden?`<button class="btn primary focusable" data-m="merge">Hesapları "${esc(cur.name)}" profiline ekle</button>`:''}
 <button class="btn focusable ${cur&&one&&!$('#app').hidden?'':'primary'}" data-m="add">Yeni profil olarak ekle</button>
 ${!one||pl.type==='all'?'<button class="btn danger focusable" data-m="replace">Bu cihazdaki tüm verileri bununla değiştir</button>':''}

function rawUrl(it){let u=it.url||'';if(it.xt&&it.kind==='live')u=u.replace(/\.(m3u8|ts)$/i,'.'+S().liveFormat);return u}
const streamUrl=u=>S().proxy&&S().proxyStreams?proxify(u):u;
const isAndroid=/Android/i.test(navigator.userAgent);
const EXTPKG={vlc:'org.videolan.vlc',mx:'com.mxtech.videoplayer.ad',just:'com.brouken.player',mpv:'is.xyz.mpv',ask:''};
const NATIVE_ENG=[['exo','ExoPlayer'],['vlc','VLC'],['system','Sistem oynatıcısı']];
function buildAttempts(it){
 const u=it.url||'',s=S(),A=[];
 const add=(engine,url)=>{if(!A.some(a=>a.engine===engine&&a.url===url))A.push({engine,url})};
 if(it.xt&&it.kind==='live'){
  const b=u.replace(/\.(m3u8|ts)$/i,''),m=b+'.m3u8',t=b+'.ts';
  if(s.liveFormat==='ts'){add('mpegts',t);add('native',m);add('hls',m);add('native',t)}
  else{add('hls',m);add('native',m);add('mpegts',t);add('native',t)}
 }else if(/\.m3u8?(\?|$)/i.test(u)){add('hls',u);add('native',u)}
 else if(/\.(ts|flv)(\?|$)/i.test(u)){add('mpegts',u);add('native',u);add('hls',u)}
 else if(/\.(mp4|m4v|webm|mov|mkv|avi|ogv|mp3|aac)(\?|$)/i.test(u)){add('native',u)}
 else{add('native',u);add('hls',u);add('mpegts',u)}
 if(s.engine!=='auto'){const f=A.filter(a=>a.engine===s.engine);if(!f.length)f.push({engine:s.engine,url:u});return f.concat(A.filter(a=>a.engine!==s.engine))}
 return A;
}

async function probeType(url){
 const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
 try{
  const r=await fetch(streamUrl(url),{signal:ctl.signal});const ct=(r.headers.get('content-type')||'').toLowerCase();
  let buf=new Uint8Array(0);const rd=r.body&&r.body.getReader?r.body.getReader():null;
  if(rd){while(buf.length<400){const x=await rd.read();if(x.done)break;const n=new Uint8Array(buf.length+x.value.length);n.set(buf);n.set(x.value,buf.length);buf=n}try{rd.cancel()}catch(e){}}
  try{ctl.abort()}catch(e){}
  const txt=String.fromCharCode.apply(null,Array.from(buf.slice(0,16))).replace(/^\uFEFF/,'');
  if(txt.startsWith('#EXTM3U')||ct.includes('mpegurl'))return'hls';
  if(ct.includes('text/html')||/^\s*<(!doctype|html)/i.test(txt))return'html';
  if((buf[0]===0x47&&(buf.length<189||buf[188]===0x47))||ct.includes('mp2t'))return'ts';
  if(txt.startsWith('FLV'))return'flv';
  if(txt.slice(4,8)==='ftyp'||(buf[0]===0x1a&&buf[1]===0x45)||/video\/(mp4|x-matroska|webm)/.test(ct))return'file';
  return'';
 }catch(e){return''}finally{clearTimeout(t)}
}
function applyProbe(k){
 if(k==='html'){P.attempts=[];P.ai=0;P.lastErr='Bu link bir video değil, bir web sayfası açıyor. Oynatıcılar yalnızca doğrudan yayın/video linklerini (m3u8, ts, mp4 vb.) oynatabilir.';return}
 const order={hls:['hls','native'],ts:['mpegts','native','hls'],flv:['mpegts'],file:['native']}[k];
 if(!order)return;const u=P.attempts[0].url;
 P.attempts=order.map(e=>({engine:e,url:u})).concat(P.attempts.filter(a=>!order.includes(a.engine)));P.ai=0;
}

function loadSubFile(f){
 const r=new FileReader();
 r.onload=()=>{
  let t=String(r.result).replace(/^\uFEFF/,'');
  if(!/^WEBVTT/.test(t))t='WEBVTT\n\n'+t.replace(/\r/g,'').replace(/(\d+:\d+:\d+),(\d+)/g,'$1.$2');
  $$('track',vid).forEach(x=>x.remove());
  const tr=document.createElement('track');tr.kind='subtitles';tr.label=f.name;tr.srclang='tr';tr.default=true;
  tr.src=URL.createObjectURL(new Blob([t],{type:'text/vtt'}));vid.appendChild(tr);
  setTimeout(()=>{[...vid.textTracks].forEach(x=>x.mode=x.label===f.name?'showing':'disabled')},150);
  closeSheet();toast('Altyazı yüklendi');
 };
 r.readAsText(f);
}

function keyName(e){
 const c=e.keyCode;
 if(c>=48&&c<=57&&!e.shiftKey)return'd'+(c-48);
 if(c>=96&&c<=105)return'd'+(c-96);
 return({37:'left',38:'up',39:'right',40:'down',13:'enter',27:'back',8:'back',10009:'back',461:'back',166:'back',4:'back',
  179:'playpause',10252:'playpause',415:'play',19:'pause',413:'stop',417:'ff',412:'rw',427:'chup',428:'chdown',33:'chup',34:'chdown',
  403:'red',404:'green',405:'yellow',406:'blue',32:'space',70:'f',77:'m'})[c]||e.key;
}
function navigate(dir,root){
 const cur=document.activeElement;
 const els=$$('.focusable,input,textarea,select',root).filter(el=>el.offsetParent!==null&&!el.disabled&&el.type!=='file');
 if(!els.length)return false;
 if(!els.includes(cur)){els[0].focus();return true}
 const r=cur.getBoundingClientRect();let best=null,bd=Infinity;
 for(const el of els){
  if(el===cur)continue;const b=el.getBoundingClientRect();let main,cross;
  if(dir==='left'){if(b.right>r.left+2)continue;main=r.left-b.right;cross=Math.max(0,b.top-r.bottom,r.top-b.bottom)}
  else if(dir==='right'){if(b.left<r.right-2)continue;main=b.left-r.right;cross=Math.max(0,b.top-r.bottom,r.top-b.bottom)}
  else if(dir==='up'){if(b.bottom>r.top+2)continue;main=r.top-b.bottom;cross=Math.max(0,b.left-r.right,r.left-b.right)}
  else{if(b.top<r.bottom-2)continue;main=b.top-r.bottom;cross=Math.max(0,b.left-r.right,r.left-b.right)}
  const ctr=(dir==='left'||dir==='right')?Math.abs((b.top+b.bottom)-(r.top+r.bottom))/2:Math.abs((b.left+b.right)-(r.left+r.right))/2;
  const d=Math.max(0,main)+cross*3+ctr*.05;
  if(d<bd){bd=d;best=el}
 }
 if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest'});return true}
 return false;
}
function mainKey(k){
 if(DIRS.has(k)){
  if(!navigate(k,$('#app'))&&k==='down'&&RT.rendered<RT.list.length){renderMore();navigate(k,$('#app'))}
  return true;
 }
 const a=document.activeElement;
 if(k==='back'){
  if($('#grid').contains(a)){const c=$('#side .cat.on')||$('#side .cat');c&&c.focus();return true}
  if(a===$('#search')){a.blur();return true}
  return false;
 }
 if(k==='red'||k==='yellow'){const c=a&&a.closest&&a.closest('.card');if(c){toggleFav(RT.list[+c.dataset.i]);const n=refreshCard(+c.dataset.i);n&&n.focus()}return true}
 if(k==='chup'||k==='chdown'){const m=$('#main');m.scrollBy(0,(k==='chup'?-.8:.8)*m.clientHeight);return true}
 return false;
}
function playerKey(k){
 const pl=$('#player'),uiOn=pl.classList.contains('ui'),sh=$('#sheet').classList.contains('open'),live=!P.vod,err=pl.classList.contains('err');
 if(k==='back'){if(sh)closeSheet();else if(uiOn&&!vid.paused&&!err)hideUI();else stopPlayer();return true}
 if(k==='stop'){stopPlayer();return true}
 if(err&&!sh){if(DIRS.has(k)){navigate(k,$('#perr'));return true}return false}
 if(k==='playpause'||(k==='space'&&!uiOn)){togglePlay();showUI();return true}
 if(k==='play'){tryPlay();return true}
 if(k==='pause'){vid.pause();return true}
 if(k==='ff'){seekBy(30);return true}
 if(k==='rw'){seekBy(-30);return true}
 if(k==='chup'){zap(-1);return true}
 if(k==='chdown'){zap(1);return true}
 if(/^d\d$/.test(k)&&live){numInput(k[1]);return true}
 if(k==='red'){if(P.item.kind!=='episode'){toggleFav(P.item);updFav()}return true}
 if(k==='green'){listSheet();return true}
 if(k==='blue'){settingsSheet();return true}
 if(k==='f'){toggleFs();return true}
 if(k==='m'){vid.muted=!vid.muted;return true}
 if(sh){if(DIRS.has(k)){navigate(k,$('#sheet'));return true}return false}
 if(!uiOn){
  if(k==='up'||k==='down'){if(live)zap(k==='up'?-1:1);else{showUI();$('#pPlay').focus()}return true}
  if(k==='left'||k==='right'){if(live){if(k==='left'&&P.list.length>1)listSheet();else{showUI();$('#pPlay').focus()}}else seekBy(k==='left'?-10:10);return true}
  if(k==='enter'){showUI();$('#pPlay').focus();return true}
  return false;
 }
 showUI();
 const a=document.activeElement;
 if(a===$('#pSeek')&&(k==='left'||k==='right')){seekBy(k==='left'?-10:10);return true}
 if(a===$('#pVol')&&(k==='left'||k==='right')){vid.muted=false;vid.volume=Math.max(0,Math.min(1,vid.volume+(k==='left'?-.1:.1)));return true}
 if(DIRS.has(k)){if(!$('#pui').contains(a)){$('#pPlay').focus();return true}navigate(k,$('#pui'));return true}
 return false;
}
function route(k,e){
 let handled=false;
 if(modalOpen()){
  if(modalKeyHook&&modalKeyHook(k,e))handled=true;
  else if(k==='back'){closeModal();handled=true}
  else if(DIRS.has(k)){navigate(k,$('#modal'));handled=true}
 }else if(P.item)handled=playerKey(k);
 else if(!$('#profiles').hidden){if(DIRS.has(k)){navigate(k,$('#profiles'));handled=true}}
 else if(!$('#app').hidden)handled=mainKey(k);
 return handled;
}
// Android uygulaması köprüsü: kumanda tuşları ve geri tuşu
window.tvKey=c=>route(keyName({keyCode:c}));
window.nativeDone=(i,pos,dur,err,next)=>{
 const it=NP.list[i];

 if(!$('#app').hidden){renderSidebar();const r=NP.ret;if(r&&r.classList&&r.classList.contains('card')&&document.contains(r)){const n=refreshCard(+r.dataset.i);(n||r).focus()}}
 if(next&&it){next==='web'?play(it,NP.list,{web:true}):play(it,NP.list,{engine:next});return}
 if(err&&it)toast(err,'Başka oynatıcı',()=>playerChooser(it,NP.list));
};
window.tvBack=()=>{if(modalOpen()||P.item)return route('back');if(!$('#app').hidden)return !!mainKey('back');return false};
document.addEventListener('keydown',e=>{
 const k=keyName(e),t=e.target;
 const inField=t&&((t.tagName==='INPUT'&&!['range','file','button'].includes(t.type))||t.tagName==='TEXTAREA'||t.tagName==='SELECT');
 if(inField){
  if(e.keyCode===8||/^d\d$/.test(k)||k==='space'||k==='f'||k==='m'||((k==='left'||k==='right')&&t.tagName!=='SELECT'))return;
  if(k==='enter'&&t.tagName==='TEXTAREA')return;
  if(k==='enter'&&t.id==='search'){e.preventDefault();const c=$('#grid .card');c&&c.focus();return}
  if(e.key&&e.key.length===1)return;
 }
 const handled=route(k,e);
 if(handled){e.preventDefault();e.stopPropagation()}
},true);

 $('#subFile').onchange=e=>{const f=e.target.files[0];if(f)loadSubFile(f);e.target.value=''};
 const seek=$('#pSeek');let drag=false;
 const to=e=>{const r=seek.getBoundingClientRect(),x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));if(isFinite(vid.duration))vid.currentTime=x*vid.duration};
 seek.addEventListener('pointerdown',e=>{drag=true;try{seek.setPointerCapture(e.pointerId)}catch(_){}to(e);showUI()});

 seek.addEventListener('pointerup',()=>drag=false);
 const pl=$('#player');
 pl.addEventListener('mousemove',()=>{if(P.item)showUI()});
 pl.addEventListener('click',e=>{
  if(!P.item||e.target.closest('button,.seek,.sheet,.perr,input'))return;
  if($('#sheet').classList.contains('open')){closeSheet();return}
  const now=Date.now();
  if(now-(P.lastTap||0)<300&&P.vod){

   if(x<.4){seekBy(-10);toast('⏪ 10 sn')}else if(x>.6){seekBy(10);toast('10 sn ⏩')}else toggleFs();return;
  }
  P.lastTap=now;clearTimeout(P.tapT);
  P.tapT=setTimeout(()=>{if(pl.classList.contains('ui')&&!vid.paused)hideUI();else showUI()},260);
 });

 $('#grid').addEventListener('contextmenu',e=>{const b=e.target.closest('.card');if(!b)return;e.preventDefault();toggleFav(RT.list[+b.dataset.i]);refreshCard(+b.dataset.i)});
 new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting))fill()},{root:$('#main'),rootMargin:'0px 0px 1200px 0px'}).observe($('#sentinel'));
 clock();setInterval(clock,10000);
 const m=location.hash.match(/#send=(\d{6})/);
 if(m){TR.pendingCode=m[1];try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
 const ps=DB.profiles;
 if(ps.length===1&&!ps[0].pin)enter(ps[0]);
 else{showProfiles();if(!ps.length)setTimeout(()=>profileEditor(null),200)}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
